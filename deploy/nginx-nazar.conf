server {
    listen 80;
    # Replace with your actual domain (e.g. app.nazarcrm.com)
    # Leave as _ if you want to accept any hostname
    server_name _;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (required for /ws/live live updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_connect_timeout 60;

        # Buffer settings
        proxy_buffering off;
    }

    # Health check (no auth required, used by Railway/Render/load-balancers)
    location /health {
        proxy_pass http://127.0.0.1:8002/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
