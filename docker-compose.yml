version: "3.9"

# ── Nazar — Docker Compose (Production) ────────────────────────────────
# Usage:
#   cp nazar/.env.template nazar/.env   # fill in your API keys
#   docker compose up -d
#   docker compose logs -f nazar
# ────────────────────────────────────────────────────────────────────────

services:
  nazar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nazar
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      # WhatsApp Cloud API
      - WA_PHONE_NUMBER_ID=${WA_PHONE_NUMBER_ID:-}
      - WA_ACCESS_TOKEN=${WA_ACCESS_TOKEN:-}
      - WA_APP_SECRET=${WA_APP_SECRET:-}
      - WA_VERIFY_TOKEN=${WA_VERIFY_TOKEN:-nazar_verify_2026}
      # LLM providers (at least one required)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      # Auth
      - NAZAR_API_KEY=${NAZAR_API_KEY:-nazar_dev_key}
      - NAZAR_TOKEN_SECRET=${NAZAR_TOKEN_SECRET:-}
      # Admin password (set this or you'll get 'changeme123')
      - NAZAR_ADMIN_PASSWORD=${NAZAR_ADMIN_PASSWORD:-}
      # Razorpay
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      # Server
      - PORT=8001
    volumes:
      # Persistent data outside the container
      # IMPORTANT: data/ contains DB, encryption keys, auth, billing, etc.
      - nazar_data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Optional: Nginx reverse proxy (uncomment for HTTPS/domain setup)
  # nginx:
  #   image: nginx:alpine
  #   container_name: nazar_nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - /etc/letsencrypt:/etc/letsencrypt:ro
  #   depends_on:
  #     - nazar

volumes:
  nazar_data:
    driver: local
