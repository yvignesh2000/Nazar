# Nazar API — Railway config
# This file applies to whichever Railway service is linked to this repo.
# For the Worker service: create a second Railway service pointing to the same
# repo and change dockerfilePath to "Dockerfile.worker" in its Settings.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
